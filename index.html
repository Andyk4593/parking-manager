<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PARKING MANAGER — парковочная смена</title><link rel="icon" href="data:,"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="game.css"><script defer src="game.js"></script></head>
<body><main id="stage" aria-label="Parking Manager — обучение и парковочная смена">
  <svg id="world" viewBox="0 0 1920 1080" aria-label="Игровая дорога с четырьмя полосами"><g id="road"></g><g id="lane-dim"></g><g id="vehicles"></g><g id="barriers"></g><g id="effects"></g></svg>
  <header class="hud"><div class="brand"><span class="parking-icon">P</span><div><h1>PARKING<br>MANAGER</h1><span class="brand-sub">ПАРКОВКА ПОД КОНТРОЛЕМ</span></div></div><div class="stats"><div class="stat"><span id="score-label">СЧЁТ</span><strong id="score" class="score">00000</strong></div><div class="stat time"><span id="time-label">ДО КОНЦА СМЕНЫ</span><strong id="time">05:00</strong><i class="time-track"><i id="time-fill"></i></i></div><div class="stat lives"><span id="lives-label">ЖИЗНИ</span><div id="lives" class="hearts"></div></div></div></header>
  <div class="road-label"><span>СПОКОЙНЫЙ ПОТОК</span></div>
  <nav id="game-controls" aria-label="Управление игрой"><button id="pause" class="secondary" disabled>Пауза</button><button data-audio="sound" id="sound" class="secondary" aria-pressed="true">Звук: вкл.</button><button data-audio="music" id="music" class="secondary" aria-pressed="true">Музыка: вкл.</button><button data-fullscreen id="fullscreen" class="secondary">На весь экран</button></nav>
  <div id="plates"></div>
  <div id="gate-zones"></div>
  <div id="training-controls" hidden><button id="training-pause" class="secondary">Пауза</button><button id="tutorial-skip" class="secondary">Пропустить обучение</button></div>
  <div id="tutorial-finger" hidden aria-hidden="true"><i></i><svg viewBox="0 0 96 128"><path d="M22 103V61H14V49H22V13H30V5H42V13H50V45H58V37H70V45H82V53H90V93H82V109H74V121H34V109Z" fill="#f2d0a0" stroke="#233d2c" stroke-width="6" stroke-linejoin="round"/><path d="M34 17V55M54 55V74M70 57V76M29 100H73" fill="none" stroke="#c89269" stroke-width="5"/></svg></div>
  <section id="training-panel" hidden aria-label="Обучение"><span id="tutorial-step" class="training-step"></span><div class="training-copy" aria-live="polite"><h2 id="tutorial-title"></h2><p id="tutorial-text"></p></div><button id="tutorial-next" class="primary">Понятно</button></section>
  <div id="feedback" role="status" aria-live="polite"></div>
  <footer class="legend"><span><i class="mini-plate white">✓</i> БЕЛЫЙ — ПРОПУСТИ <b>+5</b></span><span><i class="mini-plate black">×</i> ЧЁРНЫЙ — НЕ ОТКРЫВАЙ</span><span class="key-help"><kbd>1–4</kbd> ИЛИ НАЖАТИЕ</span></footer>
  <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-text"><div class="dialog"><span class="small-label" id="dialog-label">PARKING MANAGER</span><h2 id="dialog-title">Всё под контролем?</h2><p id="dialog-text">Пропускай машины с белыми номерами.<br>Три столкновения — конец смены.</p><div id="join-fields"><label for="nickname">Твой ник</label><input id="nickname" maxlength="20" placeholder="Например, Андрей" autocomplete="off" spellcheck="false" aria-describedby="nickname-error entry-hint"><span id="nickname-error" role="status"></span><span id="entry-hint"></span></div><div id="personal-panel"><p id="personal-result"></p><small id="storage-note"></small></div><button id="start" class="primary">Начать</button><div class="dialog-actions"><button id="dialog-training" class="secondary">Обучение</button><button id="dialog-skip" class="secondary">Играть без обучения</button><button id="restart" class="secondary" hidden>Начать заново</button><button id="dialog-menu" class="secondary" hidden>В меню</button></div><div class="dialog-settings" aria-label="Настройки"><button class="secondary" data-audio="sound" aria-pressed="true">Звук: вкл.</button><button class="secondary" data-audio="music" aria-pressed="true">Музыка: вкл.</button><button class="secondary" data-fullscreen>На весь экран</button></div></div></div>
<button id="attract-screen" hidden aria-label="Коснитесь, чтобы начать"><span>АВТОИГРА</span><strong>Коснитесь,<br>чтобы начать</strong><small>Или нажмите любую клавишу</small></button>
</main></body></html>
